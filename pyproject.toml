
[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "formresponsebot"
version = "0.1.0"
description = "Synthetic Google Forms response generator and authorized form testing tool"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "selenium>=4.20",
    "requests>=2.31",
    "pandas>=2.0"
]

[project.scripts]
formresponsebot = "formresponsebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

